name: Amin rebuild CI

on:
  push:
    branches:
      - rebuild/amin-clean-architecture-2026-11-26
  pull_request:
    branches:
      - rebuild/amin-clean-architecture-2026-11-26

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
